version: 2

project_name: git-mcp

builds:
  - id: git-mcp
    main: ./cmd/git-mcp
    binary: git-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X git-mcp/internal/server.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/releases.md

checksum:
  name_template: "{{ .ArtifactName }}.sha256"
  algorithm: sha256
  split: true
  extra_files:
    - glob: ./scripts/git-mcp-installer.sh
    - glob: ./scripts/git-mcp-installer.ps1

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '(?i)^merge '
      - '(?i)^chore\(release\):'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: lucaswilliameufrasio
    name: git-mcp
  draft: false
  extra_files:
    - glob: ./scripts/git-mcp-installer.sh
    - glob: ./scripts/git-mcp-installer.ps1
  header: |
    ## Instalação

    ### Linux e macOS

    ```sh
    curl -fsSL https://github.com/lucaswilliameufrasio/git-mcp/releases/download/{{ .Tag }}/git-mcp-installer.sh | sh -s -- --tag {{ .Tag }}
    ```

    ### Windows PowerShell

    ```powershell
    Invoke-WebRequest https://github.com/lucaswilliameufrasio/git-mcp/releases/download/{{ .Tag }}/git-mcp-installer.ps1 -OutFile git-mcp-installer.ps1
    .\git-mcp-installer.ps1 -Tag {{ .Tag }}
    ```

    O instalador confere o SHA-256 de cada arquivo antes de instalar. Isso
    protege contra corrupção no download, não contra uma release comprometida.
    Os testes rodam em Linux. macOS e Windows são builds cruzados. O servidor
    MCP roda sem argumentos: cada cliente informa o repositório na chamada.
    `git-mcp console` abre o painel local de métricas.
